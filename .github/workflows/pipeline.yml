name: Daily Data Pipeline

on:
  schedule:
    # Runs at 07:00 UTC daily — after Spotify Charts updates (~06:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Override run date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-roster/pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: the-roster/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape raw Spotify data (playcounts + monthly listeners)
        run: python -m scraper.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_DC: ${{ secrets.SP_DC }}
          SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}

      - name: Score + price artists
        run: python run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
