name: Daily Data Pipeline

on:
  schedule:
    # Runs at 07:00 UTC daily — after Spotify Charts updates (~06:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Override run date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-roster/pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: the-roster/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Scrape raw Spotify data (playcounts + monthly listeners)
        run: python -m scraper.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_DC: ${{ secrets.SP_DC }}

      - name: Compute metrics + expire contracts
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.run_date }}"
          fi
          python run.py $DATE_ARG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
